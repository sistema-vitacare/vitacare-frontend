# Integração contínua: roda o mesmo `npm run verify` exigido antes de todo
# pull request (lint, testes e build). Um erro em qualquer etapa deixa o
# check vermelho no pull request.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Um push novo na mesma branch cancela a verificação anterior, que já não
# representa o código atual.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # O job só lê o código; sem isso, o token do GitHub ficaria gravado
          # na configuração do git do runner durante toda a execução.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run verify
